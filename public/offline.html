<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - Pit Pulse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0ea5e9 0%, #14b8a6 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 1.5rem;
      padding: 2.5rem;
      text-align: center;
      max-width: 28rem;
      width: 100%;
    }
    .icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 2rem; height: 2rem; stroke: #fff; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { opacity: 0.85; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #fff;
      color: #0ea5e9;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3.75v6.75m0 0l-3-3m3 3l3-3M3 15l3-3m0 0l-3-3m3 3h6m6 0l3 3m0 0l-3 3m3-3h-6" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>You need an internet connection to access Pit Pulse. Please check your connection and try again.</p>
    <button onclick="location.reload()">Retry Connection</button>
  </div>
</body>
</html>
